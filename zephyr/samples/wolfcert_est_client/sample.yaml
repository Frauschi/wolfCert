sample:
  name: wolfCert EST client
  description: Enroll a certificate over EST from a Zephyr target
common:
  tags:
    - wolfcert
  harness: console
  harness_config:
    fixture: wolfcert_est_server
    type: multi_line
    ordered: true
    regex:
      - "enrolled: [1-9][0-9]* bytes"
      - "-----BEGIN CERTIFICATE-----"
      - "-----END CERTIFICATE-----"
tests:
  sample.wolfcert.est_client:
    timeout: 120
    platform_allow: qemu_x86
    integration_platforms:
      - qemu_x86
  sample.wolfcert.est_client.custom_ca:
    build_only: true
    platform_allow: qemu_x86
    extra_configs:
      - CONFIG_WOLFCERT_SAMPLE_CA_CERT="../../../examples/certs/mldsa/ca-cert.pem"
  sample.wolfcert.est_client.frdm_mcxn947:
    build_only: true
    platform_allow: frdm_mcxn947/mcxn947/cpu0
    integration_platforms:
      - frdm_mcxn947/mcxn947/cpu0
