sample:
  name: wolfCert EST client
  description: Enroll a certificate over EST from a Zephyr target
common:
  tags:
    - wolfcert
  harness: console
  harness_config:
    fixture: wolfcert_est_server
    type: multi_line
    ordered: true
    regex:
      - "enrolled: [1-9][0-9]* bytes"
      - "-----BEGIN CERTIFICATE-----"
      - "-----END CERTIFICATE-----"
tests:
  sample.wolfcert.est_client:
    timeout: 120
    platform_allow: qemu_x86
    integration_platforms:
      - qemu_x86
