CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_BUILTIN=y
CONFIG_WOLFSSL_SETTINGS_FILE="wolfcert_sample_settings.h"

CONFIG_WOLFCERT=y
CONFIG_WOLFCERT_EST=y
CONFIG_WOLFCERT_ECC=y

# Boot waits for an IPv4 address before main() runs. zephyr/README.md lists
# what each boards/<board>.conf adds.
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

CONFIG_HW_STACK_PROTECTION=y

CONFIG_PRINTK=y
